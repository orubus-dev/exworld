plugins { id 'com.android.application' }

def resolveExgineRoot() {
    def prop = project.findProperty('EXGINE_ROOT')
    if (prop != null && new File(prop.toString(), 'CMakeLists.txt').exists()) return prop.toString()
    def env = System.getenv('EXGINE_ROOT')
    if (env != null && new File(env, 'CMakeLists.txt').exists()) return env
    def candidates = [
        file("${rootDir}/../../exgine").absolutePath,
        file("${rootDir}/../../../exgine").absolutePath,
        file("../../../../exgine").absolutePath
    ]
    for (c in candidates) {
        if (new File(c, 'CMakeLists.txt').exists()) return c
    }
    return file("${rootDir}/../../exgine").absolutePath
}

def exgineRoot = resolveExgineRoot()
println "EXWORLD (android/) EXGINE_ROOT=${exgineRoot}"

android {
    namespace 'app.orubus.exworld'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'app.orubus.exworld'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.6.0'
        externalNativeBuild {
            cmake {
                arguments "-DEXGINE_ROOT=${exgineRoot}",
                          '-DEXGINE_BUILD_DEMO=OFF',
                          '-DEXGINE_BUILD_TESTS=OFF',
                          '-DANDROID_STL=c++_static'
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        release { minifyEnabled false; debuggable false }
        debug { debuggable true; jniDebuggable true }
    }

    sourceSets {
        main { assets.srcDirs = ['../../content'] }
    }

    externalNativeBuild {
        cmake { path file('../CMakeLists.txt'); version '3.22.1' }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
}
