name: Build EXWORLD APK (merged)

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'content/**'
      - 'android/**'
      - 'platform/android/**'
      - '.github/workflows/build-first-light-apk.yml'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout EXWORLD
        uses: actions/checkout@v4
        with:
          path: exworld

      - name: Checkout EXGINE
        uses: actions/checkout@v4
        with:
          repository: orubus-dev/exgine
          path: exgine

      - name: Bake real 3D mesh packages into content/baked
        working-directory: exworld
        run: |
          set -euo pipefail
          python3 tools/bake_real_meshes.py
          test -f content/baked/building.exg
          test -f content/baked/ground.exg
          test -f content/baked/index.exg
          echo "Baked mesh packages:"
          wc -c content/baked/*.exg

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        working-directory: exworld/android
        env:
          EXGINE_ROOT: ${{ github.workspace }}/exgine
        run: |
          gradle --no-daemon clean assembleDebug -PEXGINE_ROOT="$EXGINE_ROOT"

      - name: Verify APK (hard requirements — no asset-less APKs)
        run: |
          APK="exworld/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" > /tmp/apk-list.txt
          cat /tmp/apk-list.txt
          grep -q 'libexworld_android\.so' /tmp/apk-list.txt
          grep -q 'assets/project\.exg' /tmp/apk-list.txt
          grep -q 'assets/scenes/exworld\.scene' /tmp/apk-list.txt
          grep -q 'assets/baked/index\.exg' /tmp/apk-list.txt
          echo "APK verified: native lib + all game assets present"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exworld-merged-apk
          path: exworld/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
