name: EXWORLD Android APK (debug + signed release)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EXGINE_ROOT: ${{ github.workspace }}/exgine

    steps:
      - name: Checkout EXWORLD
        uses: actions/checkout@v4
        with:
          path: exworld

      - name: Checkout EXGINE
        uses: actions/checkout@v4
        with:
          repository: orubus-dev/exgine
          path: exgine

      - name: Bake real 3D mesh packages into content/baked
        working-directory: exworld
        run: |
          set -euo pipefail
          python3 tools/bake_real_meshes.py
          test -f content/baked/character.exg
          test -f content/baked/vehicle_sedan.exg
          test -f content/baked/building.exg
          test -f content/baked/ground.exg
          test -f content/baked/index.exg
          echo "Baked mesh packages:"
          wc -c content/baked/*.exg

      - name: Build EXGINE package compiler
        working-directory: exgine
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/exgine-tools -DEXGINE_BUILD_TOOLS=ON -DEXGINE_BUILD_TESTS=OFF -DEXGINE_BUILD_DEMO=OFF
          cmake --build /tmp/exgine-tools --target exgpack -j2

      - name: Compile authoritative XGPK content package
        working-directory: exworld
        run: |
          set -euo pipefail
          rm -rf platform/android/generated-assets
          mkdir -p platform/android/generated-assets
          args=(platform/android/generated-assets/world.exg)
          while IFS= read -r -d '' file; do
            rel=${file#content/}
            args+=("binary=${rel}:${file}")
          done < <(find content -type f -print0 | sort -z)
          /tmp/exgine-tools/exgpack "${args[@]}"
          test -s platform/android/generated-assets/world.exg
          ls -lh platform/android/generated-assets/world.exg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.log 2>&1 || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            [ -d "$HOME/Android/Sdk" ] && SDK_ROOT="$HOME/Android/Sdk"
            [ -d "/usr/local/lib/android/sdk" ] && SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          test -d "$SDK_ROOT"
          test -d "$NDK_DIR"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Write local.properties
        working-directory: exworld/platform/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          echo "EXGINE_ROOT=$EXGINE_ROOT"
          test -f "$EXGINE_ROOT/CMakeLists.txt"

      - name: Materialize release keystore from secrets (optional)
        env:
          EXWORLD_KEYSTORE_B64: ${{ secrets.EXWORLD_KEYSTORE_B64 }}
          EXWORLD_KEYSTORE_PASSWORD: ${{ secrets.EXWORLD_KEYSTORE_PASSWORD }}
          EXWORLD_KEY_ALIAS: ${{ secrets.EXWORLD_KEY_ALIAS }}
          EXWORLD_KEY_PASSWORD: ${{ secrets.EXWORLD_KEY_PASSWORD }}
        working-directory: exworld/platform/android
        run: |
          set -euo pipefail
          if [ -n "${EXWORLD_KEYSTORE_B64:-}" ]; then
            echo "$EXWORLD_KEYSTORE_B64" | base64 -d > /home/runner/exworld-release.keystore
            echo "EXWORLD_KEYSTORE_PATH=/home/runner/exworld-release.keystore" >> "$GITHUB_ENV"
            test -n "${EXWORLD_KEYSTORE_PASSWORD:-}"
            test -n "${EXWORLD_KEY_ALIAS:-}"
            [ -n "${EXWORLD_KEY_PASSWORD:-}" ] || echo "EXWORLD_KEY_PASSWORD=$EXWORLD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Release keystore materialized — APK will be signed with the release key"
          else
            echo "EXWORLD_KEYSTORE_B64 not set — release APK will fall back to the DEBUG key"
          fi

      - name: Build debug + release APKs
        working-directory: exworld/platform/android
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease 2>&1 | tee /tmp/gradle-build.log
          grep -E "EXWORLD Gradle EXGINE_ROOT|EXWORLD signing" /tmp/gradle-build.log || true

      - name: Dump native build logs on failure
        if: failure()
        working-directory: exworld/platform/android
        run: |
          echo "==== gradle tail ===="
          tail -200 /tmp/gradle-build.log || true
          find app/.cxx -type f \( -name '*.txt' -o -name '*.log' \) 2>/dev/null | head -40
          find app/.cxx -name 'CMakeError.log' -exec echo '--- {} ---' \; -exec cat {} \; 2>/dev/null || true

      - name: Verify native libs, assets and signatures inside APKs
        working-directory: exworld/platform/android
        run: |
          set -euo pipefail
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"
          echo "DEBUG APK:   $DEBUG_APK ($(du -h "$DEBUG_APK" | cut -f1))"
          echo "RELEASE APK: $RELEASE_APK ($(du -h "$RELEASE_APK" | cut -f1))"
          for APK in "$DEBUG_APK" "$RELEASE_APK"; do
            unzip -l "$APK" > /tmp/apk-list.txt
            grep -E 'lib/.*/libexworld_android\.so' /tmp/apk-list.txt
            grep -E 'assets/world\.exg' /tmp/apk-list.txt
            SIZE=$(stat -c%s "$APK")
            echo "$APK bytes=$SIZE"
            if [ "$SIZE" -lt 500000 ]; then echo "APK suspiciously small"; exit 1; fi
          done
          BT="$ANDROID_HOME/build-tools/35.0.0"
          echo "==== release APK signature ===="
          "$BT/apksigner" verify --print-certs "$RELEASE_APK" | head -6 || true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exworld-android-debug
          path: exworld/platform/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exworld-android-release
          path: exworld/platform/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
