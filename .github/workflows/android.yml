name: EXWORLD Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout EXWORLD
        uses: actions/checkout@v4
        with:
          path: exworld

      - name: Checkout EXGINE
        uses: actions/checkout@v4
        with:
          repository: orubus-dev/exgine
          path: exgine

      - name: Bake real 3D mesh packages into content/baked
        working-directory: exworld
        run: |
          set -euo pipefail
          python3 tools/bake_real_meshes.py
          test -f content/baked/character.exg
          test -f content/baked/vehicle_sedan.exg
          test -f content/baked/building.exg
          test -f content/baked/ground.exg
          test -f content/baked/index.exg
          echo "Baked mesh packages:"
          wc -c content/baked/*.exg

      - name: Build EXGINE package compiler
        working-directory: exgine
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/exgine-tools -DEXGINE_BUILD_TOOLS=ON -DEXGINE_BUILD_TESTS=OFF -DEXGINE_BUILD_DEMO=OFF
          cmake --build /tmp/exgine-tools --target exgpack -j2

      - name: Compile authoritative XGPK content package
        working-directory: exworld
        run: |
          set -euo pipefail
          rm -rf platform/android/generated-assets
          mkdir -p platform/android/generated-assets
          args=(platform/android/generated-assets/world.exg)
          while IFS= read -r -d '' file; do
            rel=${file#content/}
            args+=("binary=${rel}:${file}")
          done < <(find content -type f -print0 | sort -z)
          /tmp/exgine-tools/exgpack "${args[@]}"
          test -s platform/android/generated-assets/world.exg
          ls -lh platform/android/generated-assets/world.exg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.log 2>&1 || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            [ -d "$HOME/Android/Sdk" ] && SDK_ROOT="$HOME/Android/Sdk"
            [ -d "/usr/local/lib/android/sdk" ] && SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          test -d "$SDK_ROOT"
          test -d "$NDK_DIR"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "EXGINE_ROOT=${{ github.workspace }}/exgine" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Write local.properties
        working-directory: exworld/platform/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          echo "EXGINE_ROOT=$EXGINE_ROOT"
          test -f "$EXGINE_ROOT/CMakeLists.txt"
          ls -la "$EXGINE_ROOT" | head

      - name: Build debug APK
        working-directory: exworld/platform/android
        env:
          EXGINE_ROOT: ${{ github.workspace }}/exgine
        run: |
          set -euo pipefail
          echo "EXGINE_ROOT=$EXGINE_ROOT"
          test -f "$EXGINE_ROOT/CMakeLists.txt"
          gradle --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee /tmp/gradle-build.log

      - name: Dump native build logs on failure
        if: failure()
        working-directory: exworld/platform/android
        run: |
          echo "==== gradle tail ===="
          tail -200 /tmp/gradle-build.log || true
          echo "==== cmakeError logs ===="
          find . -name 'cmake*.log' -o -name '*.cpp.o.d' 2>/dev/null | head
          find app/.cxx -type f \( -name '*.txt' -o -name '*.log' \) 2>/dev/null | head -40
          find app/.cxx -name 'CMakeError.log' -exec echo '--- {} ---' \; -exec cat {} \; 2>/dev/null || true
          find app/.cxx -name 'CMakeOutput.log' -exec tail -80 {} \; 2>/dev/null || true
          find app/build -name '*.log' 2>/dev/null | head -20

      - name: Verify native libs and baked assets inside APK
        working-directory: exworld/platform/android
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -E 'lib/.*/libexworld_android\.so' /tmp/apk-list.txt
          grep -E 'assets/world\.exg' /tmp/apk-list.txt
          unzip -l "$APK" | grep 'baked/' || true
          SIZE=$(stat -c%s "$APK")
          echo "APK bytes=$SIZE"
          if [ "$SIZE" -lt 500000 ]; then
            echo "APK suspiciously small"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exworld-android-debug
          path: exworld/platform/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
