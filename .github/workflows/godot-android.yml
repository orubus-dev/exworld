name: godot-android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.7.2 (headless)
        run: |
          curl -sL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install export templates 4.7.2
        run: |
          curl -sL -o /tmp/tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -o /tmp/tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Configure Godot editor settings (Android SDK)
        run: |
          mkdir -p "$HOME/.config/godot"
          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(which keytool)")")")"
          ANDROID_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          config_version=5

          [export]

          android/android_sdk_path="$ANDROID_DIR"
          android/java_sdk_path="$JAVA_DIR"
          android/debug_keystore=""
          EOF
          echo "editor settings written (sdk: $ANDROID_DIR, java: $JAVA_DIR)"

      - name: Run headless smoke test
        run: |
          godot --headless --path godot --import
          godot --headless --path godot res://scenes/game.tscn ++ --smoke

      - name: Export Android APK
        run: |
          mkdir -p godot/build
          godot --headless --path godot --export-release "Android" "$GITHUB_WORKSPACE/godot/build/exworld-unsigned.apk"
          ls -la godot/build

      - name: Sign APK (zipalign + apksigner)
        env:
          KS_B64: ${{ secrets.EXWORLD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.EXWORLD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EXWORLD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.EXWORLD_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > /tmp/release.jks
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          echo "using build-tools: $BT"
          "$BT/zipalign" -f 4 godot/build/exworld-unsigned.apk godot/build/exworld-aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/release.jks \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out godot/build/exworld-release.apk \
            godot/build/exworld-aligned.apk
          "$BT/apksigner" verify --print-certs godot/build/exworld-release.apk
          VERSION=$(grep -oP '(?<=config/version=")[^"]*' godot/project.godot || echo 0.7.0)
          cp godot/build/exworld-release.apk "godot/build/exworld-${VERSION}-app.orubus.exworld-release.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exworld-signed-apk
          path: godot/build/exworld-*-release.apk
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: godot/build/exworld-*-release.apk
