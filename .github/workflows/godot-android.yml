name: godot-android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-android.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.7.2 (headless)
        run: |
          curl -sL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install export templates 4.7.2
        run: |
          curl -sL -o /tmp/tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -o /tmp/tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Configure Godot editor settings (Android SDK)
        run: |
          mkdir -p "$HOME/.config/godot"
          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(which keytool)")")")"
          ANDROID_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_DIR"
          export/android/java_sdk_path = "$JAVA_DIR"
          EOF
          echo "editor settings written (sdk: $ANDROID_DIR, java: $JAVA_DIR)"

      - name: Run headless smoke test
        run: |
          godot --headless --path godot --import
          godot --headless --path godot res://scenes/game.tscn ++ --smoke

      - name: Prepare keystore + preset
        env:
          KS_B64: ${{ secrets.EXWORLD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.EXWORLD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EXWORLD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.EXWORLD_KEY_PASSWORD }}
        run: |
          mkdir -p godot/build
          echo "$KS_B64" | base64 -d > godot/build/release.jks
          sed -i "s|^keystore/release=.*|keystore/release=\"$GITHUB_WORKSPACE/godot/build/release.jks\"|" godot/export_presets.cfg
          sed -i "s|^keystore/release_user=.*|keystore/release_user=\"$KEY_ALIAS\"|" godot/export_presets.cfg
          sed -i "s|^keystore/release_password=.*|keystore/release_password=\"$KEY_PASS\"|" godot/export_presets.cfg
          grep "^keystore/" godot/export_presets.cfg | sed 's/password=.*/password=***MASKED***/'

      - name: Export Android APK
        run: |
          godot --headless --path godot --export-release "Android" "$GITHUB_WORKSPACE/godot/build/exworld-unsigned.apk"
          ls -la godot/build

      - name: Verify signature (read-only) + rename
        run: |
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          echo "using build-tools: $BT"
          # Godot already signed the APK with the release keystore (preset injection).
          # We deliberately do NOT zipalign or re-sign — that mangles Godot's layout.
          "$BT/apksigner" verify --print-certs godot/build/exworld-unsigned.apk
          VERSION=$(grep -oP '(?<=config/version=")[^"]*' godot/project.godot || echo 0.7.1)
          cp godot/build/exworld-unsigned.apk "godot/build/exworld-v${VERSION}.apk"
          sha256sum "godot/build/exworld-v${VERSION}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exworld-signed-apk
          path: godot/build/exworld-v*.apk
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: godot/build/exworld-v*.apk
