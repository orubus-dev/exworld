plugins { id 'com.android.application' }

// EXWORLD release signing — fully env-var driven so CI and local builds share
// one path:
//   EXWORLD_KEYSTORE_PATH      absolute path to the .keystore file
//   EXWORLD_KEYSTORE_PASSWORD  keystore password
//   EXWORLD_KEY_ALIAS          key alias inside the keystore
//   EXWORLD_KEY_PASSWORD       key password (defaults to keystore password)
// When no keystore is configured the release build falls back to the debug
// key so an installable APK is ALWAYS produced (clearly reported in the log).
def ksPathEnv = System.getenv('EXWORLD_KEYSTORE_PATH')
def ksPassEnv = System.getenv('EXWORLD_KEYSTORE_PASSWORD')
def ksAliasEnv = System.getenv('EXWORLD_KEY_ALIAS')
def ksKeyPassEnv = System.getenv('EXWORLD_KEY_PASSWORD')
def ksFileEnv = null
if (ksPathEnv != null) {
    def f = new File(ksPathEnv)
    if (f.exists()) ksFileEnv = f
}
// NOTE: local vars deliberately avoid the names storePassword/keyAlias/keyPassword —
// Groovy resolves a local variable over the delegate method and a shadowed
// name would be invoked as String.call() during project evaluation.
def hasReleaseKey = ksFileEnv != null && ksPassEnv != null && ksAliasEnv != null

def resolveExgineRoot() {
    def env = System.getenv("EXGINE_ROOT")
    if (env != null && new File(env, "CMakeLists.txt").exists()) return env
    // CI: workspace/exgine next to workspace/exworld
    def candidates = [
        file("../../../../exgine").absolutePath,
        file("../../../exgine").absolutePath,
        file("${rootDir}/../../../exgine").absolutePath,
        file("${rootDir}/../../../../exgine").absolutePath
    ]
    for (c in candidates) {
        if (new File(c, 'CMakeLists.txt').exists()) return c
    }
    return file("../../../../exgine").absolutePath
}

def exgineRoot = resolveExgineRoot()
println "EXWORLD Gradle EXGINE_ROOT=${exgineRoot}"
println "EXWORLD signing: ${hasReleaseKey ? 'RELEASE keystore, alias ' + ksAliasEnv : 'DEBUG key (no env keystore configured)'}"

android {
    namespace 'app.orubus.exworld'
    compileSdk 35

    defaultConfig {
        applicationId 'app.orubus.exworld'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.6.0'
        ndkVersion '27.2.12479018'

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DEXGINE_BUILD_DEMO=OFF",
                          "-DEXGINE_BUILD_TESTS=OFF",
                          "-DEXWORLD_ANDROID=ON",
                          "-DEXGINE_ROOT=${exgineRoot}"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    if (hasReleaseKey) {
        signingConfigs {
            release {
                storeFile ksFileEnv
                storePassword ksPassEnv
                keyAlias ksAliasEnv
                keyPassword (ksKeyPassEnv != null ? ksKeyPassEnv : ksPassEnv)
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            debuggable false
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    sourceSets {
        main {
            // generated-assets lives at the platform root (CI exgpack writes
            // platform/android/generated-assets/world.exg); srcDirs are resolved
            // relative to THIS module dir (platform/android/app/).
            assets.srcDirs = ['../generated-assets']
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
